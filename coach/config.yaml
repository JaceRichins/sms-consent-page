# AI Accountability Coach — configuration
# The member roster and goals live in the Google Sheet, NOT here.
# (This repo is published to a public GitHub Pages site, so no personal data belongs in it.)

timezone: America/Denver   # matches the owner's Google Calendar; change if the group moves

owner_gmail: jace.richins1999@gmail.com   # the connected account; email check-ins go here

goals_sheet_id: 1Fz_VtOFfYSVZgWe1ToW7SI5ZLpaS11jv_zvdKZGGebY
# https://docs.google.com/spreadsheets/d/1Fz_VtOFfYSVZgWe1ToW7SI5ZLpaS11jv_zvdKZGGebY/edit
# Tabs: "Goals & Group" (the data — parse this one), "Dashboard" (formulas), "Guide" (for humans)

journal:                     # the coach's continuously growing memory (Drive folder of dated docs)
  folder_id: 1NXZPY3FYb4iMdnykNVADmmNwf0WamwYF
  # https://drive.google.com/drive/folders/1NXZPY3FYb4iMdnykNVADmmNwf0WamwYF
  doc_title_prefix: "Coach Journal"

checkin:
  event_title_prefix: "✅ 2-min check-in"
  event_time: "20:30"        # local evening reflection time
  event_duration_min: 5
  days: daily                # Sunday runs in light "reset" mode (see COACH.md)
  answer_channel: calendar_inline   # members type answers INTO the guest-editable event
  fallback_email_subject: "Check-in"   # silent fallback only — never advertised

sensors:                     # behavior data feeds (see COACH.md → Sensors & signals)
  location_email_subject: "Location"  # phone automations email pings to owner_gmail
  uploads_folder_id: 1l4QAriuEybmgFxKyRNSfQ-5vCcY51QG9   # weekly screen-time screenshots
  # https://drive.google.com/drive/folders/1l4QAriuEybmgFxKyRNSfQ-5vCcY51QG9
  screen_time_in_checkin: true        # nightly number is part of the anchor question

weekly_review:
  day: monday
  event_time: "20:00"
  event_duration_min: 15

sms:
  enabled: false             # flips on when the Twilio A2P campaign (see /index.html) is approved
